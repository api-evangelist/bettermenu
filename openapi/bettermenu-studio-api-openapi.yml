        nutrition). Recalculate nutrition after the update.


        The demographic must be valid for the recipe''s regulatory authority

        (current or updated). US_FDA supports: `adults_and_children_over_4`,

        `infants_through_12_months`, `children_1_3_years`,

        `pregnant_and_lactating_women`.'
