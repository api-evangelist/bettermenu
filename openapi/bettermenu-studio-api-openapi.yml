    SuggestAddedSugarsData:
      properties:
        report:
          anyOf:
          - $ref: '#/components/schemas/AddedSugarsReportView'
          - type: 'null'
          description: 'The Added Sugars report of this version, or null when the version carries none. Nothing is computed to fill it: a read never changes the recipe.'
        report_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Report Hash
          description: Fingerprint of the answers in `report`, the value that confirming it must present. Null when `report` is null.
        confirmation:
          $ref: '#/components/schemas/ConfirmationValidity'
          description: 'Whether a person has confirmed this report. `confirmed`: the confirmation covers this report''s answers; a change to a quantity, a serving size or the number of servings keeps it. `stale`: the recipe was confirmed, but not these answers (an ingredient was added, removed, swapped or re-pinned, the demographic or an answer changed, or an earlier version with different answers or demographic was read; a confirmation made before this rule goes stale on any change). `unconfirmed`: the report exists and has never been confirmed. `ungated`: there is no report and no confirmation. `unreadable`: the confirmation could not be read, so treat the report as not confirmed.'
        suggested_row_ids:
          items:
            type: string
          type: array
          title: Suggested Row Ids
          description: 'Ingredient row ids (`irow_...`) that now carry a suggestion on the report, in request order. A row needing a value only its supplier can give is among them: its suggestion holds a reason and no grams. An ingredient row id (`irow_...`) is the id of one ingredient row of this recipe, the same id used to answer that row. It is not a food-database ingredient id: two rows of one food have two row ids.'
        already_suggested_row_ids:
          items:
            type: string
          type: array
          title: Already Suggested Row Ids
          description: 'Ingredient row ids (`irow_...`) that already carried a current suggestion and were returned as they are: not run again, not charged and not saved. Send `refresh: true` to replace them. An ingredient row id (`irow_...`) is the id of one ingredient row of this recipe, the same id used to answer that row. It is not a food-database ingredient id: two rows of one food have two row ids.'
        left_open:
          items:
            type: string
          type: array
          title: Left Open
          description: 'Ingredient row ids (`irow_...`), as sent in ingredient_row_ids, of the rows that received no suggestion: beyond this request''s allowance, whose food record could not be found, or not settled by any stage. A person answers each of them by its ingredient row id. An ingredient row id (`irow_...`) is the id of one ingredient row of this recipe, the same id used to answer that row. It is not a food-database ingredient id: two rows of one food have two row ids.'
        config_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Config Version
          description: Version of the suggestion config used. Absent when no row was sent for a suggestion.
      type: object
      required:
      - report
      - report_hash
      - confirmation
      - suggested_row_ids
      - already_suggested_row_ids
      - left_open
      - config_version
      title: SuggestAddedSugarsData
      description: 'The updated report, plus how this request went.


        `report`, `report_hash` and `confirmation` are those of the report read, so

        the suggestions appear on the rows as `suggested` and the readiness counts

        them. A suggestion is a proposal: no row is answered until a person accepts,

        edits or overrides it.'
