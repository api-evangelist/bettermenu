openapi: 3.2.0
info:
  title: Studio API
  description: '## Recipe versioning


    Recipe is the aggregate; versions are read-only history. Use the table

    below to pick the right call.


    | I want to… | Use… |

    |-------------------------------------------------------------|------------------------------------------------------------|

    | Edit a recipe safely without overwriting someone else''s | `GET /recipes/{id}` → `If-Match` → `PATCH`/`POST`/`DELETE` |

    | See a recipe at a point in the past | `GET /recipes/{id}/versions/{version_id}` |

    | Replay the chain of state changes (signed, tamper-evident) | `GET /recipes/{id}/versions` |

    | See who changed what and when, with event detail | `GET /recipes/{id}/audit-trail` |

    | Understand why a write returned `412` | someone else edited; refetch and retry |


    The `version_id` returned on every recipe response is your edit token.

    Send it as `If-Match` on the next write; on conflict the server returns

    `412` with `current_version_id` so you can refetch and retry. There is

    no `POST /recipes/{id}/versions` — the system commits versions

    automatically when you mutate the recipe.


    The versions list and the audit trail answer different questions: the

    versions list is a tamper-evident chain of state snapshots you can

    replay; the audit trail is a filterable, event-typed log of what users

    and systems did to the recipe.'
  version: 2026-05-04.preview
  x-service-version: 0.47.0+ac83f7e
tags:
- name: Studio
  description: 'Recipe authoring: create and manage recipes, servings, ingredient resolution, nutrition computation and analysis, labels, and version history.'
paths:
  /studio/health:
    get:
      tags:
      - Studio
      summary: Studio Health
      description: 'Health check endpoint.


        Returns:

        Status object'
      operationId: checkStudioHealth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Checkstudiohealth
      x-bettermenu-mcp-status: internal
  /studio/recipes:
    post:
      tags:
      - Studio
      summary: Create Recipe
      description: 'Create a new recipe in ACTIVE state. Only name is required. Country defaults to US. Demographic defaults to adults_and_children_over_4.


        Recipes beyond your plan''s included monthly allowance are billed at your plan''s metered rate when the organization has a paid subscription; otherwise creation stops at the limit. Manage your plan and usage in BetterMenu Studio.'
      operationId: createRecipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecipeRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRecipeResponse'
        '402':
          description: 'The organization''s recipe limit is a hard stop and has been reached; the plan must change first. code: ''trial_quota_limit_reached'' on a trial, ''free_quota_limit_reached'' on the Free plan (a lifetime total: deleting or archiving a recipe does not give it back), ''quota_limit_reached'' on any other plan with no paid subscription.'
        '403':
          description: 'The organization does not permit usage beyond its included monthly allowance. code: ''metered_usage_not_permitted''.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Recipe name already exists in this organization. Use a different recipe name.
        '422':
          description: Validation failed.
      x-bettermenu-mcp-status: ga
      x-required-permission: studio.recipes.create
      x-required-capability: recipe_versioning
    get:
      tags:
      - Studio
      summary: List Recipes
      description: 'List recipes the caller can access in their organization.


        Each list item carries `latest_version_id` — the HEAD ULID for

        the recipe on the `main` branch — so callers can pin follow-up

        reads or diff against a known commit without a per-row round-trip.

        Each item also carries `status` — the recipe lifecycle state, here

        always `active` or `archived`, never `deleted`: a deleted recipe

        never appears in a list response (see below).


        Pagination is cursor-based: omit `cursor` on the first page, then

        pass `meta.cursor` from each response back as `cursor` on the next

        call. The cursor is self-contained — it carries forward the

        `sort_by`/`order`/`status` it was issued under, so subsequent pages

        don''t need to resend them. Passing a param that conflicts with what

        the cursor was issued under starts a fresh query at page 1 under the

        new param rather than erroring. A cursor that is not a cursor at all

        also starts again at page 1. A cursor that still reads as one but

        whose position is not in this list (for example, one edited or

        retyped) is rejected with a 400 `invalid_cursor`: pass cursors back

        exactly as returned. `meta` echoes the effective

        `sort_by`/`order`/`status` actually applied. Server caps `limit`

        at 100.


        Sort defaults to `updated_at desc` (most recently updated first).

        `status` filters to `active` or `archived`, and selects a pre-built

        view partition rather than filtering rows after the read — so a

        filtered page here fills to `limit` whenever more matches exist.


        Deleted recipes are excluded from every page regardless of filter,

        and `deleted` is not an accepted `status` value: a deleted recipe is

        no longer readable. This is the opposite default to

        `listCustomIngredients`, which includes deleted custom ingredients in

        every page because those stay readable.


        Available only on API versions declaring the `recipe_versioning`

        capability. Requests without this capability receive a 404.'
      operationId: listRecipes
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 100
            minimum: 1
          - type: 'null'
          description: Maximum number of recipes to return per page (1-100). Defaults to 10. Omit on later pages to keep the page size a cursor was issued under; passing a different value than the cursor was issued under restarts pagination at page 1 under the new size.
          title: Limit
        description: Maximum number of recipes to return per page (1-100). Defaults to 10. Omit on later pages to keep the page size a cursor was issued under; passing a different value than the cursor was issued under restarts pagination at page 1 under the new size.
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Opaque pagination cursor returned in `meta.cursor` from a previous response. Omit on the first page; pass back verbatim on each subsequent page. Self-contained — carries forward the sort/filter it was issued under, so subsequent pages don't need to resend `sort_by`/`order`/`status`.
          title: Cursor
        description: Opaque pagination cursor returned in `meta.cursor` from a previous response. Omit on the first page; pass back verbatim on each subsequent page. Self-contained — carries forward the sort/filter it was issued under, so subsequent pages don't need to resend `sort_by`/`order`/`status`.
      - name: sort_by
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/RecipeSortField'
          - type: 'null'
          description: Field to sort by. Defaults to `updated_at`.
          title: Sort By
        description: Field to sort by. Defaults to `updated_at`.
      - name: order
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/SortOrder'
          - type: 'null'
          description: Sort direction. Defaults to `desc` (most recently updated first).
          title: Order
        description: Sort direction. Defaults to `desc` (most recently updated first).
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/RecipeStatusFilter'
          - type: 'null'
          description: Filter to recipes in this lifecycle state. Omit to return all non-deleted recipes.
          title: Status
        description: Filter to recipes in this lifecycle state. Omit to return all non-deleted recipes.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRecipesResponse'
        '400':
          description: Invalid pagination cursor (`invalid_cursor`). The `cursor` was not issued by this endpoint for this request, for example because it was edited or retyped. Pass the previous response's cursor back unchanged, or omit `cursor` to start from the first page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-bettermenu-mcp-status: ga
      x-required-permission: studio.recipes.list
      x-required-capability: recipe_versioning
  /studio/recipes/search:
    post:
      tags:
      - Studio
      summary: Search Recipes
      description: 'Runs a recipe search on the server and returns matching recipes. Pass `q: "*"` to browse (match all recipes the caller can access) instead of running a text search. Every search is restricted to recipes the caller collaborates on.'
      operationId: searchRecipes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeSearchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeSearchResponse'
        '401':
          description: Missing or invalid authentication.
        '403':
          description: Caller is not permitted to search recipes.
        '503':
          description: The search backend is temporarily unavailable.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-bettermenu-mcp-status: ga
      x-required-permission: studio.recipes.search
  /studio/recipes/{recipe_id}:
    get:
      tags:
      - Studio
      summary: Get Recipe
      description: 'Get a recipe by id, optionally pinned to a historical version.


        `?version_id=` (omit ⇒ latest) selects the snapshot. The response

        body''s top-level `version_id` mirrors the resolved snapshot —

        HEAD when omitted, the supplied version otherwise — and the

        `ETag: W/"{version_id}"` response header is derived from that

        field. Clients can pass the ETag back as `If-Match` on the next

        mutation for optimistic concurrency.


        The response body''s `data.status` (`active` / `archived` /

        `deleted`) is the recipe lifecycle state.


        Available only on API versions declaring the `recipe_versioning`

        capability. Requests without this capability receive a 404.'
      operationId: getRecipe
      parameters:
      - name: recipe_id
        in: path
        required: true
        schema:
          type: string
          title: Recipe Id
      - name: version_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 26
            maxLength: 26
            pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          - type: 'null'
          description: Leave out for the current recipe. To read an earlier version, pass a `version_id` from the recipe's version list.
          title: Version Id
        description: Leave out for the current recipe. To read an earlier version, pass a `version_id` from the recipe's version list.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRecipeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-bettermenu-mcp-status: ga
      x-required-permission: studio.recipe.get
      x-required-capability: recipe_versioning
    patch:
      tags:
      - Studio
      summary: Patch Recipe Metadata
      description: 'Partially update recipe metadata — rename, change country, or change demographic.


        Send only the fields you want to change; omitted fields stay unchanged.


        **Side effect:** Changing `country` or `demographic` triggers automatic

        nutrition recomputation. The updated nutrition figures are available

        immediately after the update completes.


        The new name must be unique within the organization. All changes

        are logged in the audit trail.


        The response carries `version_id` — the sealed Version ULID — which

        callers pass back as `If-Match` on the next mutation for optimistic

        concurrency. A mismatch returns 412 with the current `version_id`

        so the client can refetch and retry.'
      operationId: patchRecipeMetadata
      parameters:
      - name: recipe_id
        in: path
        required: true
        schema:
          type: string
          title: Recipe Id
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: 'The recipe''s current `version_id`: the one the last change to this recipe returned, or the one reading the recipe returns (`get_recipe`). A stale value is refused with the current `version_id`; read the recipe again and retry.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRecipeMetadataRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRecipeResponse'
        '409':
          description: The `If-Match` token was present but HEAD has since moved (another writer committed). Body carries `current_version_id` so the client can fetch fresh state and retry.
        '412':
          description: The `If-Match` header was absent on a versioned recipe. Fetch the current `version_id` and retry with `If-Match` set.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-bettermenu-mcp-status: ga
      x-required-permission: studio.recipe.update
      x-required-capability: recipe_versioning
    delete:
      tags:
      - Studio
      summary: Delete Recipe
      description: 'Delete a recipe (permanent — irreversible via the API).


        Once deleted, the recipe is fully hidden from all endpoints: it no longer

        appears in list or detail reads, version history is inaccessible, and

        ``restoreRecipe`` also returns 404. There is no un-delete — ``restoreRecipe``

        is a version rollback for live recipes, not a recovery mechanism for

        deleted ones.


        Re-deleting an already-deleted recipe returns 404

        (``recipe_not_found``), which clients should treat as a successful

        deletion since the recipe is already gone.'
      operationId: deleteRecipe
      parameters:
      - name: recipe_id
        in: path
        required: true
        schema:
          type: string
          title: Recipe Id
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: 'The recipe''s current `version_id`: the one the last change to this recipe returned, or the one reading the recipe returns (`get_recipe`). A stale value is refused with the current `version_id`; read the recipe again and retry.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRecipeResponse'
        '409':
          description: The `If-Match` token was present but HEAD has since moved (another writer committed). Body carries `current_version_id` so the client can fetch fresh state and retry.
        '412':
          description: The `If-Match` header was absent on a versioned recipe. Fetch the current `version_id` and retry with `If-Match` set.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-bettermenu-mcp-status: ga
      x-required-permission: studio.recipe.delete
      x-required-capability: recipe_versioning
  /studio/recipes/{recipe_id}/archive:
    post:
      tags:
      - Studio
      summary: Archive Recipe
      description: 'Archive a recipe — take it offline.


        Sets the lifecycle marker to ARCHIVED and writes a new Version.

        Use ``unarchiveRecipe`` to reverse. Idempotent: re-archiving an

        already-archived recipe returns the existing ``version_id``.'
      operationId: archiveRecipe
      parameters:
      - name: recipe_id
        in: path
        required: true
        schema:
          type: string
          title: Recipe Id
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: 'The recipe''s current `version_id`: the one the last change to this recipe returned, or the one reading the recipe returns (`get_recipe`). A stale value is refused with the current `version_id`; read the recipe again and retry.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRecipeResponse'
        '409':
          description: The `If-Match` token was present but HEAD has since moved (another writer committed). Body carries `current_version_id` so the client can fetch fresh state and retry.
        '412':
          description: The `If-Match` header was absent on a versioned recipe. Fetch the current `version_id` and retry with `If-Match` set.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-bettermenu-mcp-status: ga
      x-required-permission: studio.recipe.archive
      x-required-capability: recipe_versioning
  /studio/recipes/{recipe_id}/unarchive:
    post:
      tags:
      - Studio
      summary: Unarchive Recipe
      description: 'Unarchive a recipe — restore an archived recipe to active state.


        Reverses ``archiveRecipe`` and commits a new Version. Idempotent:

        unarchiving a recipe that is not currently ARCHIVED returns the

        existing ``version_id`` without minting a new Version.'
      operationId: unarchiveRecipe
      parameters:
      - name: recipe_id
        in: path
        required: true
        schema:
          type: string
          title: Recipe Id
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: 'The recipe''s current `version_id`: the one the last change to this recipe returned, or the one reading the recipe returns (`get_recipe`). A stale value is refused with the current `version_id`; read the recipe again and retry.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRecipeResponse'
        '409':
          description: The `If-Match` token was present but HEAD has since moved (another writer committed). Body carries `current_version_id` so the client can fetch fresh state and retry.
        '412':
          description: The `If-Match` header was absent on a versioned recipe. Fetch the current `version_id` and retry with `If-Match` set.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-bettermenu-mcp-status: ga
      x-required-permission: studio.recipe.unarchive
      x-required-capability: recipe_versioning
  /studio/recipes/{recipe_id}/ingredient-extractions:
    post:
      tags:
      - Studio
      summary: Extract Ingredient Lines
      description: Splits a raw pasted ingredient blob into individual ingredient lines. Stateless — no Version is committed and the recipe is not modified, and extraction itself is not billed. Each returned line is ready to send as an add_ingredient item text to startIngredientResolution. Use this when a user pastes a block of ingredients that may not be separated by line breaks.
      operationId: extractIngredientLines
      parameters:
      - name: recipe_id
        in: path
        required: true
        schema:
          type: string
          title: Recipe Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractIngredientsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractIngredientsEnvelope'
        '422':
          description: 'raw_text failed validation (empty or over the max length), or extraction yielded more than 50 ingredients (code: ''too_many_ingredients'').'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: 'Extraction failed (code: ''extraction_failed'').'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      x-bettermenu-mcp-status: restricted
      x-required-permission: studio.recipe.ingredients.resolve
      x-required-capability: recipe_versioning
  /studio/recipes/{recipe_id}/ingredient-resolutions/latest:
    get:
      tags:
      - Studio
      summary: Get Latest Ingredient Resolution
      description: 'Returns the most recent ingredient resolution for this recipe.


        Only reflects the server-side resolve → confirm workflow (startIngredientResolution → confirmIngredients). Returns 404 when no resolution session exists — this is correct and expected when ingredients were set via setRecipeIngredients, which bypasses the resolution pipeline entirely. To read current ingredients regardless of how they were set, use getRecipeIngredients.'
      operationId: getLatestIngredientResolution
      parameters:
      - name: recipe_id
        in: path
        required: true
        schema:
          type: string
          title: Recipe Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveIngredientsEnvelope'
        '404':
          description: No ingredient resolution found for this recipe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-bettermenu-mcp-status: ga
      x-required-permission: studio.recipe.resolutions.read
      x-required-capability: recipe_versioning
  /studio/recipes/{recipe_id}/ingredient-resolutions:
    get:
      tags:
      - Studio
      summary: List Ingredient Resolutions
      description: 'Returns all server-side ingredient resolution sessions for this recipe, newest first. Each resolution includes the full row data with search candidates and conversion steps.


        Only reflects the server-side resolve → confirm workflow (startIngredientResolution → confirmIngredients). Returns an empty list when no resolution sessions exist — this is correct and expected when ingredients were set via setRecipeIngredients, which bypasses the resolution pipeline entirely.'
      operationId: listIngredientResolutions
      parameters:
      - name: recipe_id
        in: path
        required: true
        schema:
          type: string
          title: Recipe Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveIngredientsListEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-bettermenu-mcp-status: ga
      x-required-permission: studio.recipe.resolutions.read
      x-required-capability: recipe_versioning
    post:
      tags:
      - Studio
      summary: Start Ingredient Resolution
      description: 'Starts a new ingredient resolution. Resolves ingredient items into matched food items and gram weights. Each item declares an action (add_ingredient, keep_ingredient, replace_ingredient, update_ingredient_text, update_ingredient_name, update_ingredient_quantity, update_ingredient_grams, or remove_ingredient). Returns resolved rows with search candidates and unit conversions. Check summary.ready_to_confirm — if true, call confirmIngredients. No Version is committed.


        You are charged for the ingredient lines a model actually works on, on a first resolution and on a re-analysis alike: a line whose text is newly added or changed is parsed afresh and is charged, while lines you keep or remove, and lines that arrive already matched with a gram weight, need no model and are not charged. Lines beyond your plan''s included monthly allowance are billed at your plan''s metered rate. Manage your plan and usage in BetterMenu Studio.'
      operationId: startIngredientResolution
      parameters:
      - name: recipe_id
        in: path
        required: true
        schema:
          type: string
          title: Recipe Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveIngredientsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveIngredientsEnvelope'
        '402':
          description: 'The organization''s allowance is a hard stop and is exhausted; the plan must change first. code: ''trial_quota_limit_reached'' on a trial, ''free_quota_limit_reached'' on the Free plan, ''quota_limit_reached'' on any other plan with no paid subscription.'
        '403':
          description: 'The organization does not permit usage beyond its included monthly allowance. code: ''metered_usage_not_permitted''.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: Recipe is not modifiable (e.g. archived), or the previous_resolution_id does not match the latest resolution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Manifest validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      x-bettermenu-mcp-status: restricted
      x-required-permission: studio.recipe.ingredients.resolve
      x-required-capability: recipe_versioning
  /studio/recipes/{recipe_id}/ingredient-resolutions/confirm:
    post:
      tags:
      - Studio
      summary: Confirm and save ingredients
      description: Step 2 of the resolve → confirm workflow. Takes a resolution_id from a prior startIngredientResolution call. Validates all rows are resolved, then saves as recipe ingredients. Returns 404 if resolution not found, 409 if already confirmed, 422 if rows are unresolved or ingredient IDs are stale.
      operationId: confirmIngredients
      parameters:
      - name: recipe_id
        in: path
        required: true
        schema:
          type: string
          title: Recipe Id
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: 'The recipe''s current `version_id`: the one the last change to this recipe returned, or the one reading the recipe returns (`get_recipe`). A stale value is refused with the current `version_id`; read the recipe again and retry.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmIngredientsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateIngredientsResponse'
        '404':
          description: No resolution found for this recipe and resolution_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: The `If-Match` token was present but HEAD has since moved (another writer committed). Body carries `current_version_id` so the client can fetch fresh state and retry.
        '422':
