    ProblemDetail:
      properties:
        type:
          type: string
          title: Type
          description: URI reference identifying the problem type
          examples:
          - https://api.bettermenu.live/errors/recipe_not_found
        title:
          type: string
          title: Title
          description: Short, human-readable summary of the problem
          examples:
          - Recipe Not Found
          - Search Service Unavailable
        status:
          type: integer
          title: Status
          description: HTTP status code for this occurrence
          examples:
          - 400
          - 403
          - 404
          - 409
          - 500
          - 503
        detail:
          type: string
          title: Detail
          description: Human-readable explanation specific to this occurrence
          examples:
          - Recipe rcpe_abc123 does not exist
          - Failed to parse 2 out of 5 ingredients
        code:
          type: string
          title: Code
          description: Machine-readable error code (mirrors the type-URI slug)
          examples:
          - recipe_not_found
          - batch_parsing_error
        retryable:
          type: boolean
          title: Retryable
          description: Whether the client should retry this request
          examples:
          - true
          - false
        instance:
          anyOf:
          - type: string
          - type: 'null'
          title: Instance
          description: URI reference identifying the specific occurrence
          examples:
          - /api/v1/recipes/rcpe_abc123
        trace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Trace Id
          description: Request trace ID for debugging
          examples:
          - req_xyz789
          - trace-123-456
        errors:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Errors
          description: Optional array of individual errors for batch operations
        invalid_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Invalid Ids
          description: List of ingredient IDs that were not found (for INVALID_INGREDIENT_IDS errors)
          examples:
          - - f_abc123
            - f_xyz789
      type: object
      required:
      - type
      - title
      - status
      - detail
      - code
      - retryable
      title: ProblemDetail
      description: "RFC 7807 / 9457 Problem Details for HTTP API errors.\n\nStandard fields plus BetterMenu extensions:\n- ``code``: machine-readable error code (mirrors the slug at the end of\n  ``type``; kept for backwards-compatible client logic that still\n  branches on it).\n- ``retryable``: hint to the client about whether retrying may\n  succeed.\n- ``trace_id``: request correlation ID for support-channel triage.\n\nExtension members beyond these (``recipe_id``, ``version_id``,\n``schema_version``, etc.) are accepted at the top level — Pydantic\nserialization preserves them via ``model_config = {\"extra\": \"allow\"}``\non consumers that need a typed model. The ``build_problem_detail``\nbuilder returns a plain ``dict`` so unknown extensions flow through\nwithout ceremony.\n\nReferences:\n    - RFC 7807: https://www.rfc-editor.org/rfc/rfc7807\n    - RFC 9457: https://www.rfc-editor.org/rfc/rfc9457"
