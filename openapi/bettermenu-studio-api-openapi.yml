      title: RecipeListMeta
      description: 'Paginated meta for ``GET /recipes``, echoing the effective sort/filter.


        ``sort_by``/``order``/``status`` are the *resolved* values actually

        applied to this page — not a raw echo of the request — so a client

        that sends only `cursor` (the cursor''s embedded state carrying

        everything forward) can still know what''s in effect without

        decoding the opaque token itself.


        A distinct subclass rather than adding these fields to

        :class:`PaginatedMeta` directly, since that base class is shared by

        other paginated endpoints (versions list, audit trail) that have no

        sort/filter concept.'
    AddedSugarsDerivedView:
