      description: Panel layout of the label. `standard_vertical` is the only layout and the default; leave it out.
    RecipePublishedEvent:
      properties:
        event_id:
          type: string
          title: Event Id
          description: Unique event identifier
        actor:
          $ref: '#/components/schemas/ActorData'
          description: Actor who triggered this event
        channel:
          anyOf:
          - $ref: '#/components/schemas/AuditChannel'
          - type: 'null'
          description: Channel through which the action was performed (studio, api, agent, copilot). None for events predating channel tracking.
        client:
          anyOf:
          - $ref: '#/components/schemas/AuditClient'
          - type: 'null'
          description: App that made an agent-channel change (claude, chatgpt, cursor, ...), read from the MCP client's User-Agent. Client-reported, so a label rather than proof; see client_id. null for non-agent changes and for events recorded before this field existed.
        client_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Client Id
          description: Verified OAuth client id of the connected app, from the access token. null for non-agent changes and for events recorded before this field existed.
        timestamp:
          type: string
          title: Timestamp
          description: ISO 8601 timestamp when event occurred
        version_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Version Id
          description: ULID of the version committed by this event. Present on domain events (e.g. recipe.metadata_updated) once the version has been sealed and the back-fill stamp has run. Null on events that do not commit a version (analysis pipeline events) or on events written before this field was introduced.
        event_type:
          type: string
