    RemovedDiff:
      properties:
        kind:
          type: string
          const: removed
          title: Kind
          default: removed
        value:
          title: Value
          description: The value that was removed (is now null on the subject).
      type: object
      required:
      - value
      title: RemovedDiff
      description: Was a value, now ``None``.
    UpdateIngredientNameItem:
      properties:
        action:
          type: string
          const: update_ingredient_name
          title: Action
          description: 'Discriminator: must be ''update_ingredient_name'' for this variant.'
          default: update_ingredient_name
        row_id:
          type: string
          title: Row Id
          description: Stable row ID to update.
        ingredient_name:
          type: string
          title: Ingredient Name
          description: New display name.
        reason:
          anyOf:
          - type: string
          - type: 'null'
