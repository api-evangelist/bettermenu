        `compared_to` (or the subject''s parent when omitted), `after` carries

        the value at `version_id`. `field_relevance` classifies each changed

        field''s downstream label impact (ADR 0008 D7) so a client can group

        the diff and the "update available" signal can fire only on

        `label_affecting` changes.'
