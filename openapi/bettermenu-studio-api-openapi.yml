      - sugar_data
      - row_answer
      - row_within_total
      - all_rows_answered
      - total_sugars_known
      - added_within_total
      - ready_to_confirm
      title: CheckId
      description: Which question a check answers. The set is closed.
    ServingNutritionFactsAnalysisNutrient:
      properties:
        bmid:
          type: string
          title: Bmid
          description: BetterMenu nutrient ID
        name:
          type: string
          title: Name
          description: Nutrient name
        unit:
          type: string
          title: Unit
          description: Unit of measurement
        amount:
          type: number
          title: Amount
          description: Unrounded per-serving amount
        contributions:
          items:
            $ref: '#/components/schemas/NutrientContribution'
          type: array
          title: Contributions
          description: Ingredient contributions scaled to serving weight (including confirmed zeros)
        value_rounding:
          anyOf:
          - $ref: '#/components/schemas/ValueRoundingData'
          - type: 'null'
          description: Compliant value rounding outcome
        percent_daily_value:
          anyOf:
          - type: number
          - type: 'null'
          title: Percent Daily Value
          description: Unrounded %DV
        dv_rounding:
          anyOf:
          - $ref: '#/components/schemas/DVRoundingData'
          - type: 'null'
          description: Compliant %DV rounding outcome
        daily_value_reference:
          anyOf:
          - type: number
          - type: 'null'
          title: Daily Value Reference
          description: DV reference amount
      type: object
      required:
      - bmid
      - name
      - unit
      - amount
      - contributions
