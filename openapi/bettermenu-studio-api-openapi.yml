    AddedSugarsCaller:
      properties:
        action:
          $ref: '#/components/schemas/CallerAction'
        added_sugars_grams:
          anyOf:
          - type: string
            le: 1E+15
          - type: 'null'
          title: Added Sugars Grams
          description: 'Grams of added sugars in this row, for the quantity in `quantity_grams_when_entered`, exactly as stored. An amount given as grams is stored as entered (input takes at most 6 decimal places). An amount given per 100 g is stored as the exact product `per 100 g x quantity / 100`, never rounded, so it can carry more than 6 decimal places (for example 3.333333 per 100 g on a 3 g row is stored as 0.0999999900), and its trailing zeros follow from that arithmetic: 20.0000 and 20 are the same amount. The figures that count are in `effective`, shown at 4 decimal places.'
        quantity_grams_when_entered:
          type: string
          title: Quantity Grams When Entered
          description: The row's quantity in grams when the person made this entry. The entered grams are for that quantity and are never rewritten; the amount that counts is scaled to the current quantity.
        entered_added_sugars_per_100g:
          anyOf:
          - type: string
            le: '100'
          - type: 'null'
          title: Entered Added Sugars Per 100G
          description: 'How the person gave the amount, when they gave it per 100 g of the ingredient: the figure as entered. The entered grams above were worked out from it at the row''s quantity when the person made the entry (``per 100 g x quantity / 100``). A record of how the entry was typed only; the grams and quantity above decide the amount that counts, and this figure is not part of the report''s fingerprint. Absent when the person gave grams.'
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Optional.
        supplier_reference:
          anyOf:
          - type: string
          - type: 'null'
          title: Supplier Reference
          description: Optional reference to a supplier document.
        actor:
          $ref: '#/components/schemas/Actor'
        channel:
          $ref: '#/components/schemas/AuditChannel'
        at:
          type: string
          format: date-time
          title: At
      additionalProperties: true
      type: object
      required:
      - action
      - quantity_grams_when_entered
      - actor
      - channel
      - at
      title: AddedSugarsCaller
      description: A person's entry for an ingredient row.
