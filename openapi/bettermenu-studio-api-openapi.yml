    UpdateRecipeMetadataRequest:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Name
          description: New recipe name. Must be unique within the organization.
        country:
          anyOf:
          - type: string
            const: US
          - type: 'null'
          title: Country
          description: Update the country. **Clears computed nutrition** — recalculate after changing. Currently only `US` (→ US_FDA) is supported.
        demographic:
          anyOf:
          - $ref: '#/components/schemas/FDADemographic'
          - type: 'null'
          description: Update the demographic group for %DV calculations. Must be valid for the recipe's regulatory authority. **Clears computed nutrition** — recalculate after changing.
        rationale:
          anyOf:
