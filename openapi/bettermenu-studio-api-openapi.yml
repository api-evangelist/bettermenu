          description: Unrounded Added Sugars grams per serving.
        total_sugars_grams_per_serving:
          anyOf:
          - type: string
          - type: 'null'
          title: Total Sugars Grams Per Serving
          description: Unrounded Total Sugars grams per serving.
        declared_grams:
          anyOf:
