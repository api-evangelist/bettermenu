      description: 'Unified serving-level nutrient — strict superset of NutritionAnalysisNutrient.


        Combines ingredient contributions scaled to this serving''s weight with

        FDA-compliant rounding and %DV data. Every column visible at recipe level

        is also visible here; label compliance columns appear alongside.'
    ReadinessFindingSeverity:
      type: string
