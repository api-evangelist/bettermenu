    RecipeVersionSummary:
      properties:
        version_id:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          title: Version Id
          description: Globally unique identifier for this version of the recipe. 26-character Crockford Base32 ULID, lexicographically sortable by creation time. Use as `If-Match` on subsequent writes for optimistic concurrency, or pass to `GET /recipes/{id}/versions/{version_id}` to read the recipe state at this point in history.
        parent_version_id:
          anyOf:
          - type: string
            pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          - type: 'null'
          title: Parent Version Id
          description: Identifier of the version this one was committed on top of. `null` for the very first version of a recipe (the root of the history DAG). For every subsequent version this points at the version that was current when this commit was written, giving clients enough information to render the history as a linked list.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: UTC timestamp at which this version was sealed. ISO 8601 in API responses.
        created_by:
          type: string
          minLength: 1
          title: Created By
          description: Identifier of the actor that produced this version. A user identifier (`usr_...`) for human-authored commits, or `system:<source>` (e.g. `system:regulation-rerun`) for system-authored commits.
        summary:
          type: string
          title: Summary
          description: 'Auto-generated human-readable label describing what this version contains. Examples: `metadata.update`, `servings.create:srv_01H...`, `ingredients.confirm`. Intended for display in history lists; not a stable machine-readable discriminator.'
        restored_from_version_id:
          anyOf:
          - type: string
            pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          - type: 'null'
          title: Restored From Version Id
          description: For restore commits only — the `version_id` of the version whose content was copied to produce this commit. `null` on all other commit kinds. Use this to trace the full provenance chain when auditing a sequence of restores.
        caused_by_event_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Caused By Event Id
          description: Identifier of the audit event that triggered this version commit. Use this to navigate from a version to the domain event (e.g. `recipe.metadata_updated`) that produced it, without a separate audit-trail lookup. `null` on versions committed before this field was introduced.
        regulatory_bundle_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Regulatory Bundle Version
          description: 'Version of the pinned regulatory data bundle — the nutrient rounding rules, daily-value references and citations issued by the applicable regulatory authority — that the service was using when this version was committed. Use it to state which ruleset a stored result belongs to. It reports what the service was pinned to at commit time, not necessarily what computed the numbers this version carries: a commit that changed only metadata carries its nutrition forward unchanged, so those figures may predate this bundle. To find the bundle that produced a given figure, walk back through the version history to the most recent commit that actually changed it and read that commit''s value. `null` on versions committed before this field was introduced.'
        version_number:
          anyOf:
          - type: integer
          - type: 'null'
          title: Version Number
          description: Sequential ordinal among this recipe's versions, in the same chronological order as `version_id`. A human-friendly counterpart to the ULID for referring to a specific version (`version 5`) without the 26-character identifier. Increasing but not guaranteed contiguous — a commit that failed after claiming a number leaves a permanent gap, so do not assume the highest `version_number` equals the total version count. `null` on versions committed before this field was introduced.
      additionalProperties: false
      type: object
      required:
      - version_id
      - created_at
      - created_by
      - summary
      title: RecipeVersionSummary
      description: 'One entry in a recipe''s version history list.


        Designed for chronological list views — exposes the identifying ULID,

        the parent pointer needed to render the history DAG, and the

        auto-generated summary label that describes what changed in this

        commit. Full recipe state is intentionally absent; callers that need

        it follow up with ``GET /recipes/{id}/versions/{version_id}``.'
    CountryCode:
      type: string
      enum:
      - US
      title: CountryCode
      description: 'Market code: the country whose food data and labelling rules apply.


        Parameters name it `market`, `country` or `country_code`; all take this value.'
    RaccGuidedServingSizeInput:
      properties:
        serving_size_type:
          type: string
          const: racc_guided
          title: Serving Size Type
          description: Input type discriminator
          default: racc_guided
        category_id:
          type: string
          title: Category Id
          description: RACC category ID from listUsRaccCategories
          examples:
          - racc_cookies_crackers
        unit_type:
          type: string
          enum:
          - discrete
          - large_discrete
          - bulk
          title: Unit Type
          description: 'Product presentation: ''discrete'' = individually countable units (cookies, crackers). ''large_discrete'' = whole items divided for consumption (pizza, pie). ''bulk'' = measured by volume (cereal, flour).'
        unit_weight_g:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Unit Weight G
          description: Weight of one individual unit in grams. Required for discrete and large_discrete.
        declared_serving_units:
          type: integer
          enum:
          - 1
          - 2
          title: Declared Serving Units
          description: Manufacturer declaration for Tier B discrete units (50-67% of RACC).
          default: 1
        target_audience:
          type: string
          enum:
          - general
          - infant_toddler
          title: Target Audience
          description: Target audience for RACC lookup.
          default: general
        sold_individually:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Sold Individually
          description: Whether the product is packaged and sold individually. Applicable regulations treat such a package differently once its size is a multiple of its reference amount; the label asks for this only then, and an update replaces the serving's whole size input, so send it again.
        serving_weight_g:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Serving Weight G
          description: 'Weight in grams of one serving. Required when the category''s reference amount is a volume (its racc_unit is ''mL'' and unit_type ''bulk''): the serving is declared in that volume and its nutrition is worked out from this weight, never from the volume. Refused for a category whose reference amount is a weight. An update replaces the whole size input, so send it again.'
          examples:
          - '245'
      type: object
      required:
      - category_id
      - unit_type
      title: RaccGuidedServingSizeInput
      description: 'RACC-guided serving size inputs.


        Use when the product has a RACC category. Get a category id from the

        serving-size category search or list.'
    IngredientSearchHit:
