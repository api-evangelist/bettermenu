    GetRecipeVersionChangesData:
      properties:
        field_changes:
          additionalProperties:
            anyOf:
            - $ref: '#/components/schemas/SubModelDiff'
            - $ref: '#/components/schemas/ListDiff'
            - $ref: '#/components/schemas/AddedDiff'
            - $ref: '#/components/schemas/RemovedDiff'
            - $ref: '#/components/schemas/PrimitiveDiff'
          type: object
          title: Field Changes
          description: Map of Recipe top-level field name -> structural diff describing the subject version relative to the comparison point. Each value is one of `SubModelDiff` (nested model differs field-by-field), `ListDiff` (list with stable-identity items), `AddedDiff` (was null on the baseline, now has a value at the subject), `RemovedDiff` (was a value on the baseline, now null at the subject), or `PrimitiveDiff` (primitive `before` -> `after`). Unchanged fields do not appear; an empty map means the two states are equivalent at the Recipe-shape level.
      additionalProperties: false
      type: object
      required:
      - field_changes
      title: GetRecipeVersionChangesData
      description: 'Wire shape for the version-changes payload.


        Mirrors :class:`~studio.recipe_versioning.diff.recipe_diff.RecipeDiff`''s

        ``field_changes`` field but as a Pydantic model so FastAPI advertises

        the schema in OpenAPI. The values are the Pydantic ``FieldDiff``

        variants exactly as the diff primitive emits them — no mapping, no

        extra envelope. Diff direction is *baseline -> subject*: ``before``

        carries the value at ``compared_to`` (or the subject''s parent when

        omitted), ``after`` carries the value at ``version_id``.'
