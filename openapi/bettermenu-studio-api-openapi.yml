          type: string
          pattern: ^n_[a-z0-9_]+$
          title: Bmid
          description: Canonical BetterMenu nutrient identity for this market — a resolved reference to an existing vocabulary entry, never minted per ingredient. A nutrient with no existing entry is a governed vocabulary-extension case, not something an ingredient mints.
        nutrient_id:
