    OpenReason:
      type: string
      enum:
      - sugars_missing
      - sugars_invalid
      title: OpenReason
      description: 'Why an ingredient row has no Added Sugars answer from the data checks.


        A reason is a note on the ingredient''s data. It is stored in the row''s

        hashed ``derived`` block and is not dropped when a person answers the row,

        because a build that dropped it would change the fingerprint of a report a

        person already confirmed. Whether a row is settled is read from

        ``effective.source``, never from the presence of a reason.


        The wire values are the strings the suggester''s prompts and stored run logs

        already use. The set is closed: these are the only reasons a data check leaves a row open

        because of the ingredient''s own data. A row left open for any other reason

        carries no reason.'
