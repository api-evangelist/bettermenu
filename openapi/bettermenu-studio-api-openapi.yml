      description: Value type for an extensible ``CustomAttribute``.
    ConfirmRecipeAddedSugarsData:
      properties:
        report:
          anyOf:
          - $ref: '#/components/schemas/AddedSugarsReportView'
          - type: 'null'
          description: 'The Added Sugars report of this version, or null when the version carries none. Nothing is computed to fill it: a read never changes the recipe.'
        report_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Report Hash
          description: Fingerprint of the answers in `report`, the value that confirming it must present. Null when `report` is null.
        confirmation:
          $ref: '#/components/schemas/ConfirmationValidity'
          description: 'Whether a person has confirmed this report. `confirmed`: the confirmation covers this report''s answers; a change to a quantity, a serving size or the number of servings keeps it. `stale`: the recipe was confirmed, but not these answers (an ingredient was added, removed, swapped or re-pinned, the demographic or an answer changed, or an earlier version with different answers or demographic was read; a confirmation made before this rule goes stale on any change). `unconfirmed`: the report exists and has never been confirmed. `ungated`: there is no report and no confirmation. `unreadable`: the confirmation could not be read, so treat the report as not confirmed.'
        confirmation_stands:
          type: boolean
          title: Confirmation Stands
          description: 'True only when `confirmation` is `confirmed`: the recipe''s current report is the one confirmed and the label carries its value. False when the report changed before the request finished; the confirmation was recorded for the report the person saw, and the new report must be confirmed.'
        already_confirmed:
          type: boolean
          title: Already Confirmed
          description: True when this report was already confirmed and nothing new was recorded; the existing confirmation record is returned.
        label:
          $ref: '#/components/schemas/LabelOutcome'
          description: '`refreshed`: a new version carries the confirmed value on the label. `unchanged`: the label already agreed, so no version was cut.'
        confirmation_record:
          $ref: '#/components/schemas/AddedSugarsConfirmationRecord'
      type: object
      required:
      - report
      - report_hash
      - confirmation
      - confirmation_stands
      - already_confirmed
      - label
      - confirmation_record
      title: ConfirmRecipeAddedSugarsData
      description: 'The shared report data, with what this confirmation did.


        ``report``, ``report_hash`` and ``confirmation`` are those of the version the

        request ends at, read the way the read operation reads them, so a client

        parses the confirm response with the read model and loses nothing. The

        fields below are additive and describe the request itself.'
