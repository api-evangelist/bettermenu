          title: Field Relevance
          description: 'Map of the same field names appearing in `field_changes` to their label-relevance classification: `label_affecting` (feeds the gram basis or per-gram nutrition), `availability_affecting` (gates new composition and search without touching already-pinned uses), or `non_label_affecting` (provenance/naming/lifecycle only).'
