  /studio/recipes/{recipe_id}/restore:
    post:
      tags:
      - Studio
      summary: Restore Recipe to Version
      description: 'Roll back a live recipe to the content state it had at a prior version.


        This is a **full point-in-time restore** — every sub-entity of the recipe

        (ingredients, servings, nutrition, label configuration, summary, metadata)

        snaps back to exactly the state recorded in ``target_version_id``. Any

        sub-entities added or modified after that version — including servings added

        later — are removed in the restored commit. This matches the semantics of

        ``git checkout ``: the entire tree reverts, not just the fields that

        changed between the target and the current HEAD.


        This is a **version rollback**, not an un-delete. The recipe must be

        ACTIVE or ARCHIVED — a deleted recipe returns 404 (``recipe_not_found``),

        the same as any other read. To check whether a recipe is deleted, call

        ``getRecipe`` first; deleted recipes are fully hidden from all endpoints.


        Creates a new commit whose content matches ``target_version_id``; the existing

        history is never rewritten. The new ``version_id`` is returned in the response

        body and ``ETag`` header — pass it as ``If-Match`` on subsequent mutations.

        Returns 404 if the recipe does not exist (or is deleted), or if the target

        version does not exist; 412 on ``If-Match`` mismatch.'
      operationId: restoreRecipe
      parameters:
      - name: recipe_id
        in: path
        required: true
        schema:
          type: string
          title: Recipe Id
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: 'The recipe''s current `version_id`: the one the last change to this recipe returned, or the one reading the recipe returns (`get_recipe`). A stale value is refused with the current `version_id`; read the recipe again and retry.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreRecipeRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeAtVersionResponse'
        '409':
          description: The `If-Match` token was present but HEAD has since moved (another writer committed). Body carries `current_version_id` so the client can fetch fresh state and retry.
        '412':
          description: The `If-Match` header was absent on a versioned recipe. Fetch the current `version_id` and retry with `If-Match` set.
        '404':
          description: Recipe or target version not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          description: The stored version uses a data format that this API version cannot read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
