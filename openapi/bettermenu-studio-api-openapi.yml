    EntryMethod:
      type: string
      enum:
      - form
      - photo
      - spec-sheet
      - workbook
      - notes
      - agent-supplied
      title: EntryMethod
      description: 'How a CustomIngredient''s data was captured.


        Whole-entity, not per-nutrient — describes the capture of the entity

        once, not any single field.'
    LabelNutrient:
      properties:
        bmid:
          type: string
          title: Bmid
          description: BetterMenu nutrient ID
        display_name:
          type: string
          title: Display Name
          description: Official name or synonym override from label config
        amount:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Amount
          description: Regulatory-rounded amount, null for declare-less-than
        unit:
          type: string
          title: Unit
          description: Unit of measurement
        display_text:
          type: string
          title: Display Text
          description: Compliant label text, e.g. '15g', 'less than 1g', '0g'
        percent_dv:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Percent Dv
          description: Rounded %DV, null when no DV reference exists
        is_mandatory:
          type: boolean
          title: Is Mandatory
          description: Regulatory mandatory nutrient
        is_visible:
          type: boolean
          title: Is Visible
          description: Whether this nutrient is toggled on for label rendering. Mandatory nutrients default to True; voluntary nutrients default to False unless the recipe's label configuration overrides it.
        basis:
          $ref: '#/components/schemas/RowBasis'
          description: '''reported'' when the amount was calculated from ingredient data. ''zero_filled'' when no ingredient''s source reports a mandatory nutrient and the label prints a stated zero for the maker to confirm.'
          default: reported
        children:
          items:
            $ref: '#/components/schemas/LabelNutrient'
          type: array
          title: Children
          description: Sub-nutrients in regulatory display order
      type: object
      required:
      - bmid
      - display_name
      - unit
      - display_text
      - is_mandatory
      - is_visible
      title: LabelNutrient
      description: A single nutrient node in the label tree.
    ConfirmAddedSugarsReportRequest:
      properties:
        report_hash:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Report Hash
          description: The `report_hash` of the Added Sugars report the person was shown, exactly as returned when the report was read. The request is refused when it is not the hash of the recipe's current report, so a person can only confirm what they saw.
      additionalProperties: false
      type: object
      required:
      - report_hash
      title: ConfirmAddedSugarsReportRequest
      description: 'The report a person is confirming.


        The person is identified by the request''s credentials and the channel by how

        the request arrived; neither is accepted here.'
    LabelArtifactExportResponse:
      properties:
        label_format:
          $ref: '#/components/schemas/LabelFormat'
          description: Panel layout used for all artifacts in this response.
        resolution:
          $ref: '#/components/schemas/LabelResolution'
          description: Output resolution tier shared by all artifacts.
        version_id:
          type: string
          title: Version Id
          description: Recipe version snapshot rendered.  Clients should store this alongside ``label_format`` and ``resolution`` to reconstruct the cache key without a round-trip.
        version_number:
          anyOf:
          - type: integer
          - type: 'null'
          title: Version Number
          description: Sequential number of the recipe version rendered (for example 15 for "v15").  Null for versions sealed before numbering existed.
        provenance:
          anyOf:
          - $ref: '#/components/schemas/LabelProvenance'
          - type: 'null'
          description: Versions of the rules and software behind these files.
        artifacts:
          items:
            $ref: '#/components/schemas/ArtifactResult'
          type: array
          title: Artifacts
          description: One entry per requested output format.
        meta:
          $ref: '#/components/schemas/StudioMeta'
          description: Standard API response envelope with version, request_id, and timestamp.
      type: object
      required:
      - label_format
      - resolution
      - version_id
      - artifacts
      - meta
      title: LabelArtifactExportResponse
      description: 'Response body for ``GET /recipes/{id}/servings/{sid}/label-export``.


        Contains one :class:`ArtifactResult` per requested output format.

        All artifacts share the same ``label_format``, ``resolution``, and

        ``version_id`` — they differ only in file format (PDF / PNG / JPEG).


        ``version_id`` reflects the recipe snapshot rendered.  When the

        request did not supply a ``?version_id=`` query parameter, this is

        the HEAD version at the time the request was processed.'
    PatchAddedSugarsReportRowsRequest:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AddedSugarsRowAnswerItem'
          type: array
          maxItems: 100
          minItems: 1
          title: Items
          description: 'One answer per row, from 1 to 100 items, each naming a different row. Each item takes the same fields as answering a single row (`action`, `added_sugars_grams` or `added_sugars_per_100g`, `reason`, `supplier_reference`). All items are saved together or none are: if any row cannot take its answer, nothing is saved.'
      additionalProperties: false
      type: object
      required:
      - items
      title: PatchAddedSugarsReportRowsRequest
      description: Answers for several ingredient rows, saved together as one new version.
    ListCustomIngredientVersionsResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/CustomIngredientVersionSummary'
          type: array
          title: Data
          description: Version summaries for this page, ordered newest-first. Empty when the custom ingredient has no versions.
        meta:
          $ref: '#/components/schemas/PaginatedMeta'
          description: Pagination metadata. `meta.cursor` is `null` when there are no further pages; otherwise pass it back as the `after` query parameter to fetch the next page.
      additionalProperties: false
      type: object
      required:
      - data
      - meta
      title: ListCustomIngredientVersionsResponse
      description: 'Paginated list of versions for a single custom ingredient, newest first.


        Pagination uses an opaque cursor passed back as `?after=<cursor>`.

        Versions are ordered by creation time. `limit` is capped

        server-side at 50.'
    CreateRecipeRequest:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
          description: Recipe name
        country:
          type: string
          const: US
          title: Country
          description: Country whose regulatory framework applies. Determines which regulatory authority and demographic groups are valid. Currently only `US` (→ US_FDA) is supported.
          default: US
        demographic:
          $ref: '#/components/schemas/FDADemographic'
          description: 'Demographic group for %DV (percent daily value) calculations. Must be valid for the country''s regulatory authority. US_FDA demographics: `adults_and_children_over_4` (default), `infants_through_12_months`, `children_1_3_years`, `pregnant_and_lactating_women`.'
          default: adults_and_children_over_4
      type: object
      required:
      - name
      title: CreateRecipeRequest
      description: 'Create a new recipe in ACTIVE state.


        Only `name` is required. Country defaults to `US` (the only supported

        country today — more coming soon) and demographic defaults to

        `adults_and_children_over_4`, the general-population demographic group.


        The demographic must be valid for the country''s regulatory authority.

        US (US_FDA) supports: `adults_and_children_over_4`,

        `infants_through_12_months`, `children_1_3_years`,

        `pregnant_and_lactating_women`.'
      examples:
      - name: Chocolate Chip Cookies
      - demographic: infants_through_12_months
        name: Baby Rice Cereal
    CallerAction:
      type: string
      enum:
      - accept_suggestion
      - set_contribution
      - remove_contribution
      - add_contribution
      - keep
      title: CallerAction
      description: What a person did with an ingredient row's answer.
    AddedSugarsRowView:
      properties:
        ingredient_row_id:
          type: string
          maxLength: 26
          minLength: 26
          pattern: ^irow_[a-z0-9]{21}$
          title: Ingredient Row Id
          description: Stable row identity (``irow_...``); the diff key.
        ingredient:
          $ref: '#/components/schemas/AddedSugarsRowIngredientView'
        derived:
          $ref: '#/components/schemas/AddedSugarsDerivedView'
        suggested:
          anyOf:
          - $ref: '#/components/schemas/AddedSugarsSuggestedView'
          - type: 'null'
