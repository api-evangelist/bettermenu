      description: 'A nutrient''s identity within one market''s regulatory system: the

        canonical ``bmid`` paired with that market''s official nutrient id.


        The whole pair is per-market because both halves can diverge across

        markets. Most nutrients share one ``bmid`` (Protein is the same bmid in

        the US and FSANZ; only the regulatory id differs), but

        methodology-divergent ones do not — US energy in kcal and FSANZ energy in

        kJ carry different bmids as well as different ids. One nutrient''s identity

        as a single market''s regulatory system expresses it.'
    CustomIngredientAuditTrailResponse:
