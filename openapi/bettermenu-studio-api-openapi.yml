          type: string
          title: Serving Size Type
          description: 'How the serving was created: ''user_provided'' or ''racc_guided'''
        serving_size:
          anyOf:
          - $ref: '#/components/schemas/ServingSize'
          - type: 'null'
          description: Computed serving size. Null when awaiting computation.
        racc_inputs:
          anyOf:
