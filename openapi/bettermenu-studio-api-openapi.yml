            pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          - type: 'null'
          title: Version Id
          description: Version committed for this mutation; pass on the next request as `If-Match` for optimistic concurrency. Present only on versions declaring the `recipe_versioning` capability.
      type: object
      required:
      - data
      - meta
      title: NutritionFactsResponse
      description: Response for nutrition facts endpoints (per-serving + per-container).
    SetCustomIngredientNutritionResponse:
      properties:
        data:
          $ref: '#/components/schemas/CustomIngredientData'
        meta:
          $ref: '#/components/schemas/StudioMeta'
        version_id:
          anyOf:
          - type: string
            pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
