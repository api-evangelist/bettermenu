          - type: 'null'
          title: Ingredient Id
          description: The food-database id, for a food ingredient.
        custom_ingredient_id:
          anyOf:
          - type: string
            maxLength: 26
            minLength: 26
            pattern: ^cing_[a-z0-9]{21}$
          - type: 'null'
          title: Custom Ingredient Id
        custom_ingredient_version_id:
          anyOf:
          - type: string
            pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          - type: 'null'
          title: Custom Ingredient Version Id
          description: The pinned version of a custom ingredient.
        name:
          type: string
          title: Name
          description: Display name at classification time.
        quantity_grams:
          type: string
          title: Quantity Grams
        total_sugars_per_100g:
          anyOf:
          - type: string
          - type: 'null'
          title: Total Sugars Per 100G
        total_sugars_grams:
          anyOf:
          - type: string
          - type: 'null'
          title: Total Sugars Grams
          description: 'Grams of total sugars in this row: `quantity_grams` x `total_sugars_per_100g` / 100, worked out by the server so no client multiplies. Given at the same four decimal places as the grams, rounded half up. It is the row''s ceiling: the exact figure an answer''s `added_sugars_grams` is checked against once the answer is rounded to four decimal places, half up, so an answer equal to it is accepted and one above it is refused. Null when `total_sugars_per_100g` is null. A row whose figure per 100 g is not a valid amount has a problem check on its sugar data instead of a ceiling.'
      additionalProperties: true
      type: object
      required:
      - name
      - quantity_grams
      title: AddedSugarsRowIngredientView
      description: 'What was classified: one food or one pinned custom ingredient, with the

        grams of total sugars the row holds.'
    SuggestAddedSugarsRequest:
      properties:
        ingredient_row_ids:
          items:
            type: string
          type: array
          maxItems: 15
          title: Ingredient Row Ids
          description: 'Ingredient row ids (`irow_...`) of the recipe''s open Added Sugars rows, each at most once. Ids that are not open rows of this recipe are ignored: they come back neither as a suggestion nor in left_open. An ingredient row id (`irow_...`) is the id of one ingredient row of this recipe, the same id used to answer that row. It is not a food-database ingredient id: two rows of one food have two row ids.'
        refresh:
          type: boolean
          title: Refresh
          description: 'By default a row that already carries a current suggestion is returned as it is, in `already_suggested_row_ids`: it is not run again, not charged and not saved, so asking twice costs once. Send `true` to run those rows again, replace their suggestion and charge for them as new. A suggestion is current until the row''s ingredient changes.'
          default: false
      type: object
      required:
