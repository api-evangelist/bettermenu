      type: object
      required:
      - serving_id
      title: AddedSugarsDeclaration
      description: 'The figures declared for one serving, with the basis that produced them.


        The declared range of a figure is not stored; it is re-derived from the

        unrounded amount (``added_sugars_grams_per_serving`` for Added Sugars,

        ``total_sugars_grams_per_serving`` for Total Sugars), the rounding rule of

        the pinned regulatory package version (``engine.regulatory_package_version``)

        and the declared ``outcome``. For example a "less than" threshold of 1 g

        stands for the range from 0.5 g up to, not including, 1 g, and a zero

        declaration for 0 g up to, not including, 0.5 g; the bounds belong to the

        rule, so the report keeps the unrounded values the rule needs, for both

        figures, to run it again.'
