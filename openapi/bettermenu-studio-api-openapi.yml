  /studio/custom-ingredients/{custom_ingredient_id}/restore:
    post:
      tags:
      - Studio
      summary: Restore Custom Ingredient to Version
      description: 'Roll back a custom ingredient to the content state it had at a prior version.


        This is a **full point-in-time restore** — the entity''s entire state

        (nutrients, serving/gram basis, name, lifecycle status, attributes)

        snaps back to exactly what was recorded in `target_version_id`. This

        matches the semantics of `git checkout `: the whole entity

        reverts, not just the fields that changed between the target and the

        current HEAD.


        Lifecycle status is part of that state, so a restore re-projects the

        target version''s status onto HEAD: restoring past an `archive` puts the

        ingredient back in `active` or `draft`, exactly as

        `unarchiveCustomIngredient` would.


        It does **not** undo a delete. A `deleted` ingredient is refused with

        409 `custom_ingredient_not_restorable` — `deleteCustomIngredient` is

        permanent (ADR 0008 D11), and this is what makes it so. `restoreRecipe`

        refuses a deleted recipe too, by a different route: a deleted recipe is

        hidden from all reads, so it 404s.


        Creates a new commit whose content matches `target_version_id`; the

        existing history is never rewritten. The new `version_id` is

        returned in the response body — pass it as `If-Match` on subsequent

        mutations. Returns 404 if the custom ingredient or the target version

        does not exist; 409 on a `deleted` ingredient or an `If-Match`

        mismatch.


        A recipe pinned to a specific custom-ingredient `version_id` is

        unaffected by this call — pins are immutable by `version_id`

        (ADR 0007 D2), so restoring the custom ingredient to a different

        version never changes what an already-pinned recipe reads or

        computes.'
      operationId: restoreCustomIngredient
      parameters:
      - name: custom_ingredient_id
        in: path
        required: true
        schema:
          type: string
          title: Custom Ingredient Id
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: 'The custom ingredient''s current `version_id`: the one the last change to this custom ingredient returned, or the one reading it returns (`get_custom_ingredient`). A stale value is refused with the current `version_id`; read the custom ingredient again and retry.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreCustomIngredientRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCustomIngredientResponse'
        '409':
          description: Either the custom ingredient is `deleted` — a permanent state no version can be restored over, code `custom_ingredient_not_restorable` — or the `If-Match` token was present but HEAD has since moved (another writer committed), in which case the response body carries `current_version_id` so the client can fetch fresh state and retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '412':
          description: The `If-Match` header was absent on a versioned recipe. Fetch the current `version_id` and retry with `If-Match` set.
        '404':
          description: Custom ingredient or target version not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-bettermenu-mcp-status: ga
      x-required-permission: studio.custom_ingredient.versions.restore
