    IngredientPortionDetail:
      properties:
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
          description: Real portion id, or `null` for a synthesized entry.
        origin:
          type: string
          title: Origin
          description: '`"measured"`, `"synthesized"`, or `"branded_default"`.'
        amount:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Amount
          description: Portion amount, e.g. 1 for '1 cup'.
        unit_name:
          type: string
          title: Unit Name
          description: Measure unit name, e.g. 'cup' — or, for origin=`"branded_default"`, a display label verbatim (e.g. "1 tsp (5g)").
        gram_weight:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Gram Weight
