      required:
      - ingredient_row_id
      - ingredient
      - derived
      title: AddedSugarsRowView
    IngredientStatusFilter:
      type: string
      enum:
      - active
      - archived
      title: IngredientStatusFilter
    CustomNutrient-Output:
      properties:
        id:
          anyOf:
          - type: string
            maxLength: 26
            minLength: 26
            pattern: ^nrow_[a-z0-9]{21}$
          - type: 'null'
          title: Id
          description: Stable per-row identifier (nrow_xxx) for diff/identity purposes only — not a nutrient vocabulary reference. Omit when adding a new row; the server mints one. Send back verbatim when editing an existing row so its identity is preserved across saves.
        unit:
          type: string
          title: Unit
          description: Unit the amount is expressed in. Once the nutrient resolves to a market identity, the unit must match that nutrient's canonical unit — a mismatch is rejected.
        amount:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Amount
          description: Present-with-value, present-as-zero, or unknown (None). None must never be coerced to zero.
        market_nutrients:
          additionalProperties:
            $ref: '#/components/schemas/MarketNutrient'
          propertyNames:
            $ref: '#/components/schemas/CountryCode'
          type: object
          title: Market Nutrients
          description: Per-market nutrient identity, one entry per approved market. An entry is present once the nutrient resolves for that market; a nutrient that cannot resolve for a market has no entry there and degrades off that market's label. Empty until a market is approved.
      type: object
      required:
      - unit
      title: CustomNutrient
      description: 'A user-provided nutrient value on a custom ingredient.


        Carries the physical value (``amount`` + ``unit``) and the nutrient''s

        identity in each approved market (``market_nutrients``). ``amount`` is

        tri-state: a value, zero, or unknown (``None``); unknown is never zero.

        ``id`` identifies the row, not the nutrient: omit it on a new row and

        send it back unchanged when editing an existing one.'
    NutritionLabelData:
      properties:
        header:
          $ref: '#/components/schemas/LabelHeader'
