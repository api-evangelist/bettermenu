          type: object
          title: Field Changes
          description: Map of CustomIngredient top-level field name -> structural diff describing the subject version relative to the comparison point. Unchanged fields do not appear; an empty map means the two states are equivalent.
        field_relevance:
          additionalProperties:
            $ref: '#/components/schemas/LabelRelevance'
