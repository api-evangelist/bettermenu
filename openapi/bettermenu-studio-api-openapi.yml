        ingredient_name:
          type: string
          title: Ingredient Name
          description: Ingredient name extracted from the ingredient text.
      type: object
      required:
      - quantity_text
      - quantity
      - unit
      - ingredient_name
      title: RecipeParsedIngredient
      description: Parsed ingredient components.
    LabelConfigurationData:
      properties:
        recipe_id:
