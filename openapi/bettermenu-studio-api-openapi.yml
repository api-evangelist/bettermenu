          description: true when per-container nutrition facts exist (dual-column labels)
      type: object
      required:
      - id
      - serving_size_type
      - has_per_serving_nutrition_facts
      - has_per_container_nutrition_facts
      title: Serving
      description: Serving with serving size and nutrition facts availability.
    CustomIngredientSummary:
      properties:
        id:
          type: string
          title: Id
          description: Custom ingredient ID
        name:
          type: string
          title: Name
          description: User-given custom ingredient name
        status:
          $ref: '#/components/schemas/CustomIngredientStatus'
          description: Lifecycle state (`draft` / `active` / `archived`).
        created_at:
          type: string
          title: Created At
          description: ISO 8601 creation timestamp
        updated_at:
