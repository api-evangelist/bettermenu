                form: '#/components/schemas/ApiFormIngredient'
                resolution: '#/components/schemas/ApiResolutionIngredient'
          type: array
          title: Ingredients
          description: Updated list of ingredients for this recipe.
        ingredient_conversions:
          anyOf:
          - items:
              $ref: '#/components/schemas/IngredientConversionDetail'
