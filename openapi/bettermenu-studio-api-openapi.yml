          - type: string
          - type: 'null'
          title: Updated At
          description: ISO 8601 timestamp of the last update; null if not yet created.
        acknowledged_fills:
          items:
            $ref: '#/components/schemas/AcknowledgedFillView'
          type: array
          title: Acknowledged Fills
          description: Saved confirmations of nutrients printed as a stated zero.
      type: object
      required:
      - recipe_id
      - nutrients
      - has_custom_configuration
      - created_by
      - updated_at
      title: LabelConfigurationData
      description: Response data envelope.
    CustomIngredientCreatedEvent:
      properties:
        event_type:
          $ref: '#/components/schemas/CustomIngredientEventType'
          description: Which change this event records.
        event_id:
          type: string
          title: Event Id
          description: Unique event identifier
        actor:
          $ref: '#/components/schemas/ActorData'
          description: Actor who triggered this event
        channel:
          anyOf:
          - $ref: '#/components/schemas/AuditChannel'
          - type: 'null'
          description: Channel through which the action was performed.
        client:
          anyOf:
          - $ref: '#/components/schemas/AuditClient'
          - type: 'null'
          description: App that made an agent-channel change (claude, chatgpt, cursor, ...), read from the MCP client's User-Agent. Client-reported, so a label rather than proof; see client_id. null for non-agent changes and for events recorded before this field existed.
        client_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Client Id
          description: Verified OAuth client id of the connected app, from the access token. null for non-agent changes and for events recorded before this field existed.
        timestamp:
          type: string
          title: Timestamp
          description: ISO 8601 timestamp when event occurred
        changed_fields:
          items:
            type: string
          type: array
          title: Changed Fields
          description: Fields changed by this event
        version_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Version Id
          description: Version this event committed.
      type: object
      required:
      - event_type
      - event_id
      - actor
      - timestamp
      - changed_fields
      title: CustomIngredientCreatedEvent
      description: 'One audit-trail entry for a custom ingredient.


        Despite the name (kept for wire-compatibility with the first shipped

        event type), this shape carries every ``CustomIngredientEventType`` —

        creation, nutrition/serving updates, and confirmation all share the

        same envelope (``changed_fields`` + ``event_type`` discriminate).'
    CheckId:
      type: string
