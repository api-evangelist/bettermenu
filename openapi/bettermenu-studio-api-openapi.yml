      x-required-permission: studio.recipe.ingredients.resolve
      x-required-capability: recipe_versioning
  /studio/recipes/{recipe_id}/added-sugars-report/suggestions:
    post:
      tags:
      - Studio
      summary: Suggest Added Sugars Answers
      description: 'Suggests an answer for each requested open Added Sugars row of the recipe and saves the suggestions on the report in ONE new version, for a person to accept, edit or override. A suggestion is a proposal: it appears on the row as `suggested` and counts in the report''s `readiness.suggested_rows`, and no row is answered until a person accepts it (`accept_suggestion`). Rows a person has already answered are never changed. A row that already carries a current suggestion is returned as it is (`already_suggested_row_ids`) and not run, saved or charged again, so asking twice costs once; send `refresh: true` to replace it. The response is the updated report in the shape of reading it, with `suggested_row_ids`, `left_open` and `config_version` in `data`.


        Rows beyond the request''s allowance, rows whose food record could not be found and rows no suggestion settled get no suggestion and are returned in `left_open` for the person to answer. When no row gets a suggestion nothing is saved and `version_id` is the current version.


        Every row is named by its ingredient row id (`irow_...`), the id of one ingredient row of this recipe and the id used to answer that row.


        Send the recipe''s current `version_id` in the `If-Match` header. A stale token is refused before any suggestion is made or charged.


        The operation is served only while suggestions are switched on; otherwise it answers 403 `suggester_not_enabled`.


        You are charged one credit per row that returns a confident or unsure suggestion that was saved. Rows left open, and rows that need a value from the supplier, are not charged.'
      operationId: suggestRecipeAddedSugars
      parameters:
      - name: recipe_id
        in: path
        required: true
        schema:
          type: string
          title: Recipe Id
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: 'The recipe''s current `version_id`: the one the last change to this recipe returned, or the one reading the recipe returns (`get_recipe`). A stale value is refused with the current `version_id`; read the recipe again and retry.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestAddedSugarsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestAddedSugarsEnvelope'
        '409':
          description: 'The `If-Match` token is stale (code: ''version_conflict'', with `current_version_id`), the recipe is not modifiable, e.g. archived (code: ''recipe_not_modifiable''), or the stored report no longer matches the recipe (code: ''added_sugars_report_not_current'').'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '412':
          description: The `If-Match` header was absent on a versioned recipe. Fetch the current `version_id` and retry with `If-Match` set.
        '403':
          description: 'Suggestions are not switched on (code: ''suggester_not_enabled''), or the caller may not change the recipe.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: 'The recipe has no Added Sugars report (code: ''added_sugars_report_not_found'').'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: 'More than 15 ingredient row ids (code: ''too_many_row_ids''), or an ingredient row id given twice (code: ''duplicate_row_ids'').'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
