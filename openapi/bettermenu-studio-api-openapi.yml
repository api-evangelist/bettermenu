          - $ref: '#/components/schemas/AddedSugarsCaller'
          - type: 'null'
        effective:
          $ref: '#/components/schemas/AddedSugarsEffectiveView'
        checks:
          items:
            $ref: '#/components/schemas/GuidanceCheck'
          type: array
          title: Checks
          description: 'Plain-language checks on this row: the sentence about this recipe, why it matters, the rule''s own words and a link into the documentation.'
      additionalProperties: true
