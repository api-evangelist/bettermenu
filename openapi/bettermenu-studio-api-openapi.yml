          anyOf:
          - $ref: '#/components/schemas/DeclaredFigure'
          - type: 'null'
          description: The Total Sugars figure the panel declares.
        population:
          anyOf:
          - $ref: '#/components/schemas/FDADemographic'
          - type: 'null'
          description: The demographic the daily value is for.
        drv_grams:
          anyOf:
          - type: string
          - type: 'null'
          title: Drv Grams
        percent_dv:
          anyOf:
          - type: string
          - type: 'null'
          title: Percent Dv
        dv_basis:
          anyOf:
          - $ref: '#/components/schemas/DvBasis'
          - type: 'null'
