      required:
      - origin
      - amount
      - unit_name
      - gram_weight
      title: IngredientPortionDetail
      description: "One serving-size portion on an ingredient, standard or custom.\n\n``origin`` states where this portion comes from — and for\n`\"branded_default\"`, changes how the other fields must be read:\n\n* `\"measured\"` — a real, independently measured reference-ingredient\n  portion. `amount` and `unit_name` are genuinely meaningful, e.g.\n  `amount=1, unit_name=\"cup\"`.\n* `\"synthesized\"` — derived from a custom ingredient's reference\n  serving; `id` is `null`.\n* `\"branded_default\"` — a branded product's single labeled serving.\n  `id` is a real portion id, but `amount` is always `1` and `unit_name`\n  holds a human-readable label verbatim (e.g. `\"1 tsp (5g)\"`), not a\n  real convertible unit — there is no independent \"amount of a unit\"\n  for a branded product. Render `unit_name` as-is; never decompose it."
