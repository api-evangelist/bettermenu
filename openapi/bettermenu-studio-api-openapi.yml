  /studio/recipes/{recipe_id}/added-sugars-report/confirm:
    post:
      tags:
      - Studio
      summary: Confirm Added Sugars
      description: 'Records that a person reviewed the recipe''s Added Sugars report and accepts it. Once confirmed, the Added Sugars line appears on the recipe''s nutrition label and in its nutrition analysis. Send the `report_hash` of the report the person was shown and the recipe''s current `version_id` as `If-Match`.


        The request is refused when the hash is not the current report''s (the report changed since it was read), when the report still has unanswered rows or findings, or when the recipe changed since `If-Match`. Adding, removing or swapping an ingredient (or a custom ingredient''s version), changing the demographic or changing an answer afterwards makes the confirmation stale and it must be given again. Changing a quantity, a serving size or the number of servings does not: amounts, declarations and the label are recomputed, and a quantity that would push added sugars above total sugars is still refused.


        Confirming records the person''s attestation, who is taken from the credentials and the channel from how the request arrived. An agent must only call this after the person has asked it to confirm the report. Repeating a request for a report that is already confirmed records nothing new and returns the existing confirmation.'
      operationId: confirmRecipeAddedSugarsReport
      parameters:
      - name: recipe_id
        in: path
        required: true
        schema:
          type: string
          title: Recipe Id
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: 'The recipe''s current `version_id`: the one the last change to this recipe returned, or the one reading the recipe returns (`get_recipe`). A stale value is refused with the current `version_id`; read the recipe again and retry.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmAddedSugarsReportRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmRecipeAddedSugarsResponse'
        '409':
          description: The `If-Match` token is stale (`version_conflict`); the report hash is not the current report's (`report_hash_not_current`); the report cannot be confirmed yet (`report_not_confirmable`); another confirmation won a race (`confirmation_superseded`); the recipe is not modifiable (`recipe_not_modifiable`); or the confirmation is recorded but the label could not be refreshed while the recipe kept changing (`label_refresh_incomplete`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '412':
          description: The `If-Match` header was absent on a versioned recipe. Fetch the current `version_id` and retry with `If-Match` set.
        '404':
          description: Recipe not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: The label cannot be computed with the confirmed value for the recipe as it stands (`label_not_computable`); nothing was confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      x-bettermenu-mcp-status: ga
      x-required-permission: studio.recipe.ingredients.confirm
      x-required-capability: recipe_versioning
  /studio/recipes/{recipe_id}/added-sugars-report/rows/{ingredient_row_id}:
    patch:
      tags:
      - Studio
      summary: Answer One Added Sugars Row
      description: 'Records your answer for one ingredient row of the recipe''s Added Sugars report and returns the updated report in the same shape as reading it: `data` holds `report`, `report_hash` (the value confirming this report needs) and `confirmation`, and `version_id` is the new version. The row is named by its ingredient row id (`irow_...`), the id of one ingredient row of this recipe: two rows of one food have two row ids.


        The `action` is one of `accept_suggestion`, `set_contribution`, `add_contribution`, `remove_contribution` or `keep`. For `set_contribution` and `add_contribution` give the amount either as `added_sugars_grams` (grams in this row at its current quantity) or as `added_sugars_per_100g` (grams per 100 g of the ingredient), never both: the server turns per-100 g into row grams at the row''s current quantity. Each row of the report also carries the counted amount per 100 g (`added_sugars_per_100g`) so you never divide. A `reason` and a `supplier_reference` are optional on every action. Your answer is kept as you gave it, with the row''s quantity at the time, the person and the channel. The row''s counted grams, the totals, the declarations and the findings are recomputed from it.


        An answer that puts a row''s, the batch''s or a serving''s added sugars above its total sugars is rejected and nothing is saved. Nothing is ever lowered to fit.


        Every answer saves one new version of the recipe, so an earlier confirmation of the report no longer applies and the Added Sugars line is taken off the recipe''s nutrition and labels until the new report is confirmed. Send the recipe''s current `version_id` in the `If-Match` header.'
      operationId: patchRecipeAddedSugarsReportRow
      parameters:
      - name: recipe_id
        in: path
        required: true
        schema:
          type: string
          title: Recipe Id
      - name: ingredient_row_id
        in: path
        required: true
        schema:
          type: string
          minLength: 26
          maxLength: 26
          pattern: ^irow_[a-z0-9]{21}$
          description: Ingredient row id (`irow_...`) of the row to answer, as the report names it.
          title: Ingredient Row Id
        description: Ingredient row id (`irow_...`) of the row to answer, as the report names it.
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: 'The recipe''s current `version_id`: the one the last change to this recipe returned, or the one reading the recipe returns (`get_recipe`). A stale value is refused with the current `version_id`; read the recipe again and retry.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchAddedSugarsReportRowRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRecipeAddedSugarsResponse'
        '409':
          description: 'The `If-Match` token is stale (code: ''version_conflict'', with `current_version_id`), the recipe is archived (code: ''recipe_not_modifiable''), or the stored report no longer matches the recipe (code: ''added_sugars_report_not_current'', with `reason` ''ingredients_changed'' or ''no_demographic'').'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '412':
          description: The `If-Match` header was absent on a versioned recipe. Fetch the current `version_id` and retry with `If-Match` set.
        '404':
          description: 'The recipe has no Added Sugars report (code: ''added_sugars_report_not_found''), or the report has no such ingredient row (code: ''added_sugars_row_not_found'').'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: 'The answer puts added sugars above total sugars (code: ''added_sugars_exceed_total'', naming the rows, servings or batch), an amount cannot be held (code: ''added_sugars_amount_out_of_range''), or the action has nothing to act on (code: ''added_sugars_entry_not_applicable'', including `reason` ''row_has_no_quantity'' for a per-100 g answer on a row of 0 g). A body that gives both or neither of `added_sugars_grams` and `added_sugars_per_100g` for `set_contribution` or `add_contribution`, or either for another action, is a validation error.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      x-bettermenu-mcp-status: ga
      x-required-permission: studio.recipe.ingredients.resolve
      x-required-capability: recipe_versioning
  /studio/recipes/{recipe_id}/added-sugars-report/rows:
    patch:
      tags:
      - Studio
      summary: Answer Several Added Sugars Rows
      description: 'Records your answers for several ingredient rows of the recipe''s Added Sugars report in one request and returns the updated report in the same shape as reading it: `data` holds `report`, `report_hash` and `confirmation`, and `version_id` is the new version. Use it when a recipe has more than one row to answer: it saves ONE new version for all of them and rebuilds the report once, where answering row by row saves a version per row and needs a fresh `If-Match` for each.


        `items` holds from 1 to 100 answers, each naming a different row by its ingredient row id (`irow_...`) and taking the same fields as answering a single row: `action` (`accept_suggestion`, `set_contribution`, `add_contribution`, `remove_contribution` or `keep`), then for `set_contribution` and `add_contribution` exactly one of `added_sugars_grams` (grams in this row at its current quantity) or `added_sugars_per_100g`, and an optional `reason` and `supplier_reference`.


        The answers are saved together or not at all. If any row cannot take its answer, the whole request is refused with 422 `added_sugars_rows_refused`, `rows` names every such row with its reason, and nothing is saved. If the answers together put a row''s, the batch''s or a serving''s added sugars above its total sugars, the request is refused with 422 `added_sugars_exceed_total` naming them, and nothing is saved. If both kinds of fault are in one request, the 422 is `added_sugars_rows_refused` and its `rows` also lists each row that breaks its own total sugars, with `row_code` `added_sugars_exceed_total`, so every bad row is marked in one round. Nothing is ever lowered to fit.


        Saving a version ends any earlier confirmation of the report and takes the Added Sugars line off the recipe''s nutrition and labels until the new report is confirmed. Send the recipe''s current `version_id` in the `If-Match` header.'
      operationId: patchRecipeAddedSugarsReportRows
      parameters:
      - name: recipe_id
        in: path
        required: true
        schema:
          type: string
          title: Recipe Id
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: 'The recipe''s current `version_id`: the one the last change to this recipe returned, or the one reading the recipe returns (`get_recipe`). A stale value is refused with the current `version_id`; read the recipe again and retry.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchAddedSugarsReportRowsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRecipeAddedSugarsResponse'
        '409':
          description: 'The `If-Match` token is stale (code: ''version_conflict'', with `current_version_id`), the recipe is archived (code: ''recipe_not_modifiable''), or the stored report no longer matches the recipe (code: ''added_sugars_report_not_current'', with `reason` ''ingredients_changed'' or ''no_demographic'').'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '412':
          description: The `If-Match` header was absent on a versioned recipe. Fetch the current `version_id` and retry with `If-Match` set.
        '404':
          description: 'The recipe has no Added Sugars report (code: ''added_sugars_report_not_found'').'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: 'Nothing was saved. The body is invalid, for example no items, more than 100, a row named twice, or both or neither of `added_sugars_grams` and `added_sugars_per_100g` (code: ''validation_error''). One or more rows cannot take their answer (code: ''added_sugars_rows_refused''; `rows` lists each with its `ingredient_row_id`, its `row_code` (''added_sugars_row_not_found'', ''added_sugars_entry_not_applicable'' or ''added_sugars_amount_out_of_range'', or, beside such rows, ''added_sugars_exceed_total'' for a row that breaks its own total sugars), a `reason` when there is one, and a `detail`). Or the answers, with nothing else wrong, put added sugars above total sugars (code: ''added_sugars_exceed_total'', naming the rows, servings or batch), or an amount cannot be held (code: ''added_sugars_amount_out_of_range'').'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddedSugarsRowsRefusedProblem'
