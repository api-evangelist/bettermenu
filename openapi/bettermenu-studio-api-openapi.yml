    CustomIngredientVersionSummary:
      properties:
        version_id:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          title: Version Id
          description: Globally unique identifier for this version of the custom ingredient. 26-character Crockford Base32 ULID, lexicographically sortable by creation time. Use as `If-Match` on subsequent writes for optimistic concurrency.
        parent_version_id:
          anyOf:
          - type: string
            pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          - type: 'null'
          title: Parent Version Id
          description: Identifier of the version this one was committed on top of. `null` for the very first version of a custom ingredient (the root of the history DAG).
        created_at:
          type: string
          format: date-time
          title: Created At
          description: UTC timestamp at which this version was sealed. ISO 8601 in API responses.
        created_by:
          type: string
          minLength: 1
          title: Created By
          description: Identifier of the actor that produced this version. A user identifier (`usr_...`) for human-authored commits, or `system:<source>` for system-authored commits.
        summary:
          type: string
          title: Summary
          description: Auto-generated human-readable label describing what this version contains, e.g. `custom_ingredient.nutrition.set`, `custom_ingredient.confirm`. Intended for display in history lists; not a stable machine-readable discriminator.
        restored_from_version_id:
          anyOf:
          - type: string
            pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          - type: 'null'
          title: Restored From Version Id
          description: For restore commits only — the `version_id` whose content was copied to produce this commit. `null` on all other commit kinds.
        caused_by_event_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Caused By Event Id
          description: Identifier of the audit event that triggered this version commit. Use this to navigate from a version to the audit-trail entry that produced it.
        version_number:
          anyOf:
          - type: integer
          - type: 'null'
          title: Version Number
          description: Sequential ordinal among this custom ingredient's versions, in the same chronological order as `version_id`. A human-friendly counterpart to the ULID for referring to a specific version (`version 5`) without the 26-character identifier. Increasing but not guaranteed contiguous — a commit that failed after claiming a number leaves a permanent gap, so do not assume the highest `version_number` equals the total version count. `null` on versions committed before this field was introduced.
      additionalProperties: false
      type: object
      required:
      - version_id
      - created_at
      - created_by
      - summary
      title: CustomIngredientVersionSummary
      description: 'One entry in a custom ingredient''s version history list.


        Carries the version id, its parent and the auto-generated change

        summary, not the full ingredient state: read a version to get that

        state, or its changes to get the diff.'
