          anyOf:
          - type: string
          - type: 'null'
          title: Added Sugars Per 100G
          description: Grams of added sugars per 100 g of this ingredient, worked out by the server from the grams and the quantity so no client divides. Given at the same four decimal places as the grams. Null when there are no grams to express or the row's quantity is zero. Taken at the quantity the proposal was made at, so it does not move when the row's quantity changes.
